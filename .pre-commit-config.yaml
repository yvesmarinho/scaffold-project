repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Gitleaks Secret Scanner
        entry: uv run python -m scripts.secrets_scan --mode staged
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        name: Check YAML Syntax
        exclude: ^\.github/
      - id: check-json
        name: Check JSON Syntax
      - id: check-added-large-files
        name: Check Large Files
        args: ["--maxkb=1000"]
      - id: detect-private-key
        name: Detect Private Keys
        exclude: ^\.secrets/
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        exclude: ^docs/SESSIONS/
      - id: end-of-file-fixer
        name: Fix End of Files
        exclude: ^docs/SESSIONS/

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.11.0
    hooks:
      - id: ansible-lint
        name: Ansible Lint
        files: ^scaffold/templates/project/ansible/.*\.ya?ml$
        args: [scaffold/templates/project/ansible/]
        language_version: python3.12

  # black, ruff e bandit: mesma versão do uv.lock (= CI). Alinhamento verificado
  # por tests/test_precommit_versoes_alinhadas.py.
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        name: Black Python Formatter
        language_version: python3.12

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        name: Ruff Linter
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: Bandit Security Linter
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/
