repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Gitleaks Secret Scanner
        entry: uv run python -m scripts.secrets_scan --mode staged
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        name: Check YAML Syntax
        # helm/templates: templates Go ({{ }}), não YAML — validados por
        # scripts/validate-templates.py (detecta "{ {" corrompido)
        # objetivo-examples/objetivo.yaml: formato híbrido v2 (frontmatter + Markdown)
        exclude: ^(\.github/|scaffold/templates/project/k8s-helm/helm/templates/|docs/reference/objetivo-examples/objetivo\.yaml$)
      - id: check-json
        name: Check JSON Syntax
      - id: check-added-large-files
        name: Check Large Files
        args: ["--maxkb=1000"]
      - id: detect-private-key
        name: Detect Private Keys
        exclude: ^\.secrets/
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        exclude: ^docs/SESSIONS/
      - id: end-of-file-fixer
        name: Fix End of Files
        exclude: ^docs/SESSIONS/

  # black, ruff e bandit: hooks locais via `uv run` — a versão vem do uv.lock
  # (a mesma do CI) e o Dependabot atualiza um lugar só. Formato verificado por
  # tests/test_precommit_versoes_alinhadas.py.
  - repo: local
    hooks:
      - id: black
        name: Black Python Formatter
        entry: uv run black
        language: system
        types: [python]
        require_serial: true

      - id: ruff
        name: Ruff Linter
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        require_serial: true

      - id: bandit
        name: Bandit Security Linter
        entry: uv run --extra security bandit -c pyproject.toml
        language: system
        types: [python]
        exclude: ^tests/
        require_serial: true

      # Tipagem: alvo e regras em [tool.mypy] (pyproject.toml). Checa o
      # projeto inteiro (pass_filenames: false) — erro de tipo é cross-file.
      - id: mypy
        name: Mypy Type Checker
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
