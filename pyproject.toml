[project]
name = "scaffold-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepmerge>=1.1.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "ruff>=0.1.11",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "types-pyyaml>=6.0.12.20261122",
    "types-jsonschema>=4.26.0.20261006",
    "types-requests>=2.33.0.20261030",
]
security = [
    "bandit[toml]>=1.7.6",
    "safety>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaffold_project"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "S101",  # use of assert (common in tests)
    "UP009", # cabeçalho "# -*- coding: utf-8 -*-" é obrigatório pelo padrão do projeto
    # S603: dispara em toda chamada de subprocess, mesmo sem shell e com args em
    # lista (decisão 24/11/2026). Seguem ativas S602 (shell=True) e S607
    # (executável sem caminho absoluto).
    "S603",
]

# scripts/tmp/: scripts descartáveis de correções antigas — não publicados
# (fora do --publish) nem importados por nenhum módulo.
extend-exclude = ["scripts/tmp"]

[tool.ruff.per-file-ignores]
# Testes: asserts; subprocess com argumentos fixos do próprio teste (S603/S607);
# caminhos /tmp em fixtures e dados de teste (S108). Código de produção segue
# coberto por essas regras.
"tests/**/*.py" = ["S101", "S603", "S607", "S108"]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "build",
    "dist",
]
skips = [
    "B101",  # assert_used (common in tests, handled by exclude_dirs)
    # B404/B603: disparam em todo import/chamada de subprocess, mesmo sem shell
    # (decisão 24/11/2026). Seguem ativas B602 (shell=True) e B607 (caminho parcial).
    "B404",
    "B603",
]

[tool.bandit.assert_used]
skips = ['*_test.py', 'test_*.py']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Alvo padrão (`uv run mypy`). Os módulos de scripts/ se importam como `lib.*`
# (sys.path com scripts/, igual aos testes e ao scaffold.py), então a base de
# pacotes é scripts/ — sem isso o mypy aborta com "Source file found twice".
files = ["scripts"]
mypy_path = "scripts"
explicit_package_bases = true
# scripts/tmp/: descartáveis, já fora do ruff (extend-exclude acima)
exclude = ["^scripts/tmp/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Alguns arquivos importam o mesmo código como `scripts.lib.*` (alias do
# `lib.*` acima); seguir esse caminho registraria cada arquivo duas vezes.
# O código é checado uma vez, como `lib.*`.
[[tool.mypy.overrides]]
module = "scripts.*"
follow_imports = "skip"

# textual: dependência opcional da TUI (scripts/manage.py), não declarada no
# projeto nem instalada no CI.
[[tool.mypy.overrides]]
module = ["textual", "textual.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov=scripts",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["src", "scripts"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
]
