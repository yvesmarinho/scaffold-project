# Modificado em: 24/11/2026 15:31
#
# CI principal do repositório (fonte dos required status checks da `main`).
# Sem filtro de paths: check obrigatório com filtro de paths trava PRs que não o disparam.
name: CI — Template Scaffold

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Install specify CLI (SpecKit — usado por `scaffold new`)
        run: uv tool install specify-cli --from "git+https://github.com/github/spec-kit.git@v1.4.4"

      - name: Git identity (testes que criam commits em repos temporários)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Run full test suite
        run: uv run pytest tests/ --tb=short

  cli-smoke:
    name: CLI Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Smoke — list profiles
        run: uv run python scripts/scaffold.py --list-profiles --json

      - name: Smoke — dry run
        run: |
          uv run python scripts/scaffold.py --new --dry-run --ci \
            --name smoke-test \
            --domain programming \
            --language python

      - name: Smoke — publish
        run: uv run python scripts/scaffold.py --publish --json --output-dir "${RUNNER_TEMP}/publish"

      - name: Smoke — verify SBOM targets in Layer 2 profiles
        run: |
          for profile in python-fastapi python-flask typescript-next; do
            makefile="scaffold/templates/project/${profile}/Makefile"
            if [ -f "$makefile" ]; then
              grep -q "^sbom:" "$makefile" && echo "OK: sbom target found in $profile/Makefile" \
                || echo "WARNING: sbom target missing in $profile/Makefile"
            else
              echo "INFO: $makefile not found (profile may not include Makefile)"
            fi
          done

  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Compile scaffold.py (syntax check)
        run: uv run python -m py_compile scripts/scaffold.py && echo "scaffold.py OK"

      - name: Type check (mypy)
        run: uv run mypy

      - name: Validate scaffold templates (YAML/JSON, Go templates, objetivo v2)
        run: uv run python scripts/validate-templates.py

      - name: Validate profile descriptors YAML (scaffold/profiles)
        run: |
          uv run python - <<'EOF'
          import sys
          import yaml
          from pathlib import Path

          errors = []
          for f in Path("scaffold/profiles").glob("*.yaml"):
              try:
                  data = yaml.safe_load(f.read_text(encoding="utf-8"))
                  if not isinstance(data, dict):
                      errors.append(f"{f}: não é um dict")
              except yaml.YAMLError as e:
                  errors.append(f"{f}: {e}")

          if errors:
              for err in errors:
                  print(f"ERRO: {err}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {len(list(Path('scaffold/profiles').glob('*.yaml')))} descritores validados")
          EOF

      - name: Ruff (repositório inteiro)
        run: uv run ruff check . --output-format=github
